[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
# The release version, which the release script moves. hushrun-core, -attest, -ledger and -tlog
# keep a fixed version of their own, because the hosted service builds with them.
version = "0.13.0"
edition = "2024"
rust-version = "1.94"
# MIT (LICENSE.md, ADR 0063), with THIRD-PARTY-NOTICES.md for the crates it is built with.
license = "MIT"
# The public repository: the source, the releases and the GitHub Actions. cargo-dist builds the
# installers' download URLs from it.
repository = "https://github.com/hushrun/hushrun"
# Nothing is published to crates.io.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
hushrun-core = { path = "crates/hushrun-core" }
hushrun-digest = { path = "crates/hushrun-digest" }
hushrun-vcs = { path = "crates/hushrun-vcs" }
hushrun-attest = { path = "crates/hushrun-attest" }
hushrun-ledger = { path = "crates/hushrun-ledger" }
hushrun-artifact = { path = "crates/hushrun-artifact" }
hushrun-ci = { path = "crates/hushrun-ci" }
hushrun-testkit = { path = "crates/hushrun-testkit" }
hushrun-tlog = { path = "crates/hushrun-tlog" }
hushrun-reports = { path = "crates/hushrun-reports" }
hushrun-build = { path = "crates/hushrun-build" }

anyhow = "1.0.100"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
dirs = "6"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem", "zeroize"] }
getrandom = "0.3"
gix = { version = "0.90", default-features = false, features = ["max-performance", "parallel", "revision", "sha1", "sha256"] }
hex = "0.4.3"
# Build blocks search compiled outputs for folder paths (B-10). Every build has it already,
# under regex and aho-corasick.
memchr = "2.8"
jiff = { version = "0.2.24", default-features = false, features = ["std"] }
ignore = "0.4.23"
mimalloc = { version = "0.1.48", default-features = false }
# Test and coverage reports (C-27), read as a stream: no DTD, no entity expansion.
quick-xml = { version = "0.42", default-features = false }
rayon = "1.10"
# \[ADR 0072\] This machine's store of what test files read, for `hushrun why` and the plan: SQLite,
# built from its amalgamation (bundled), so every release target has the same SQLite and no
# system library is needed. The second C code after ring and mimalloc, by that ADR.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
regex-automata = "0.4.9"
# Release versions, for `hushrun update` and the newer-release notice (ADR 0035). The binary
# already built it, as a build dependency of curve25519-dalek.
semver = "1.0.28"
serde = { version = "1.0.219", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10.9"
# Isolated runs (M8) remove their container and export when interrupted: pure Rust over libc.
signal-hook = { version = "0.3.18", default-features = false }
# `hushrun run` kills a check past its timeout with every process it started (Unix): rustix's
# safe kill(2), without unsafe code. gix and tempfile already build it.
rustix = { version = "1.1", features = ["process"] }
tempfile = "3.20"
thiserror = "2.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
unicode-normalization = "0.1.24"
zeroize = "1.8"
# \[C-38\] A hint's bytes are a zlib stream: pure Rust, which the binary already builds for gix
# (gix-zlib), so the release targets gain no crate and no C code.
zlib-rs = { version = "0.6.8", default-features = false, features = ["std"] }

# HTTP ledgers (M18): reqwest and rustls without a crypto provider. hushrun installs ring's
# (plan §12.3), so no aws-lc C code is built.
async-trait = "0.1.92"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
# The transparency log's hashes and signatures (M18), and ECDSA P-256 and certificate signatures
# (M10), from the provider rustls already uses.
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
# OCI promotion (M5): the registry client, without a crypto provider like reqwest above.
bytes = "1.12"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }

# Keyless signing and timestamps (M10, ADR 0013). ECDSA P-256 and certificate
# signatures use ring (above), the TLS provider already built for every target, so no new C
# code; certificates and RFC 3161 tokens are read with RustCrypto's pure-Rust DER crates.
der = { version = "0.7.10", features = ["alloc", "derive", "oid"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }
cms = { version = "0.2.3", default-features = false, features = ["std"] }

# Tests only.
assert_cmd = "2.0.17"
predicates = { version = "3.1", default-features = false }
proptest = { version = "1.6", default-features = false, features = ["std"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

# The profile that cargo-dist builds release artifacts with.
[profile.dist]
inherits = "release"
