# Publish the repository's package store (ADR 0163, K-14), so that sandboxes with no Dockerfile
# (Antigravity Remote Agents, Claude Code on the web, ...) start with the dependencies already
# downloaded: `hushrun packages pull` puts the newest store at /hushrun-packages.
# Copy to .github/workflows/hushrun-packages.yml.
#
# Each push to the default branch runs the install command under `hushrun packages bake`, which
# keeps what it downloaded as a one-layer image tagged hushrun-packages-<platform>-<id16> and
# moves hushrun-packages-<platform>-latest. A store already published for these lockfiles
# uploads nothing again. `--oci hushrun` publishes it into hushrun's registry, beside the baked
# store, with the job's own ID token: sandboxes then pull it with no setting of their own. It needs
# the repository to use hushrun's hosted backend.
#
# Replace: the toolchain setup and the install command.
#
# To publish to a registry of your own instead, such as this repository's GHCR packages:
#   - run: hushrun packages bake --oci ghcr.io/acme/shop -- npm ci
#     env:
#       GITHUB_TOKEN: ${{ github.token }}            # GHCR's login, as GITHUB_ACTOR
# add `packages: write` to the permissions, and set HUSHRUN_PACKAGES_IMAGE=ghcr.io/acme/shop in the
# sandbox (and HUSHRUN_PACKAGES_REGISTRY_TOKEN, a classic PAT with read:packages, if the package is
# private).
name: hushrun packages
on:
  push:
    branches: [main]          # the default branch
  workflow_dispatch:

# One bake at a time: a later one never lands under an earlier one's tag.
concurrency:
  group: hushrun-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write             # hushrun's registry grants the push to this token; it signs the store

jobs:
  bake:
    # On the default branch alone: by hand there too, never a fork's branch of the same name.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: hushrun/hushrun/action/setup@main        # pin to a release commit
        # The newest hushrun release; `with: { version: X.Y.Z }` pins one, from the release after 0.21.1.
      - run: hushrun packages bake --oci hushrun -- npm ci
