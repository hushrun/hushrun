name: Publish

# After the Release workflow publishes a release: the container image (plan §14, ADR 0019),
# tagged latest too when the release is the newest (ADR 0035), and install-hushrun.sh with the
# release's checksums pinned, attached to the release. Run it by hand to publish them again for a
# release.
#
# The releases are this repository's own, so GitHub's token for this run attaches files and edits
# the notes: no other token is involved.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: The release, such as 0.9.0
        required: true

permissions:
  contents: read

env:
  # Where release.yml publishes releases: this repository (github-releases-repo in
  # dist-workspace.toml).
  RELEASES: ${{ github.repository }}

concurrency:
  # One group a release, by its tag: a run by hand names 0.9.0, a release's run v0.9.0.
  group: publish-${{ inputs.version && format('v{0}', inputs.version) || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    # Release also runs on pull requests, to plan; only a tag's successful run published one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT:-${TAG#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=publish::not a release version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # install-hushrun.sh with this release's checksums, which adopters vendor as
  # ci/install-hushrun.sh.
  installer:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Attaches install-hushrun.sh to the release.
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: gh release download "v$VERSION" --repo "$RELEASES" --pattern '*.tar.xz.sha256' --dir sums
      - run: cargo xtask installer-pins --version "$VERSION" --from sums --out install-hushrun.sh
      - run: shellcheck -s sh install-hushrun.sh
      - run: gh release upload "v$VERSION" install-hushrun.sh --repo "$RELEASES" --clobber

  # ghcr.io/<owner>/hushrun:<version>, for linux/amd64 and linux/arm64, with the bytes the
  # release's musl archives hold; also :latest when it is the newest release (ADR 0035).
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Adds the image to the release notes.
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - name: Take the binaries from the release's archives
        run: |
          set -euo pipefail
          mkdir -p archives
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            gh release download "v$VERSION" --repo "$RELEASES" --dir archives \
              --pattern "hushrun-$target.tar.xz" --pattern "hushrun-$target.tar.xz.sha256"
          done
          (cd archives && sha256sum -c ./*.sha256)
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch=${pair%%:*}
            target=${pair#*:}
            mkdir -p "context/dist/$arch" "unpacked/$arch"
            tar -xJf "archives/hushrun-$target.tar.xz" -C "unpacked/$arch"
            find "unpacked/$arch" -type f -name hushrun -exec cp {} "context/dist/$arch/hushrun" \;
            test -s "context/dist/$arch/hushrun"
          done
          # The license and the third-party notices go beside the binary, as in the archives.
          cp LICENSE.md THIRD-PARTY-NOTICES.md context/
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hushrun" >> "$GITHUB_ENV"
      # latest is the release GitHub calls the latest, which `hushrun update`, the setup action,
      # the reusable workflow and install-hushrun.sh install by default: never a pre-release,
      # and never an older release that a run by hand publishes again.
      - id: tags
        name: Tag latest only for the newest release
        run: |
          set -euo pipefail
          tags="$IMAGE:$VERSION"
          newest=$(gh release view --repo "$RELEASES" --json tagName --jq .tagName)
          if [ "$newest" = "v$VERSION" ]; then
            tags="$tags,$IMAGE:latest"
          else
            echo "$IMAGE:latest stays where it is: the newest release is $newest" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: deploy/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          # The version, and latest for the newest release; never a major version.
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          push: true
      - name: Name the image in the release notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          line="Container image: \`$IMAGE:$VERSION@$DIGEST\`"
          gh release view "v$VERSION" --repo "$RELEASES" --json body --jq .body > notes.md
          if ! grep -qF "$IMAGE:$VERSION@" notes.md; then
            printf '\n%s\n' "$line" >> notes.md
            gh release edit "v$VERSION" --repo "$RELEASES" --notes-file notes.md
          fi
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
