name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      # Golden vectors pin exact bytes: a checkout must never convert line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run fmt -- cargo fmt --all --check
      - run: hushrun run clippy -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: hushrun run test -- cargo test --workspace --locked
      - run: hushrun run trace -- cargo xtask trace
