name: CI

# The CLI's checks, on every push to main and every pull request. This repository is public, so its
# Actions minutes cost nothing, macOS's included: the `macos` job runs clippy, the tests, the Python
# references and the npm packages there too. release.yml builds the Windows binaries when a release
# is made.
#
# `hushrun run NAME -- COMMAND` skips a check this exact code already passed (hushrun.yaml). These
# stay outside hushrun, since their result can change while the code doesn't: cargo deny (its
# advisories change by the day), public-good Sigstore (a service and its trust root), fuzzing
# (random inputs) and the secret scanners (their rules change). Each job that runs through hushrun
# has one variant, since a job with several never skips (C-14), and a check counts only from Linux
# on amd64 unless hushrun.yaml says otherwise (C-25): the macOS job's checks have names of their own,
# which count only from macOS.
#
# Pull requests run with `pull_request`, never `pull_request_target`: a fork's code gets a read-only
# token and no secrets. This repository has no secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run fmt -- cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run clippy -- cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Golden vectors pin exact bytes: a checkout must never convert line endings (M1).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      # pytest, pytest-xdist and pytest-cov for the tests of `tests: observe` (ADR 0068), which
      # fail rather than pass without them when HUSHRUN_TEST_TOOLS is `required`; then Go and
      # Vitest.
      - name: Install pytest for the test-file tests
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet pytest==8.4.2 pytest-xdist==3.8.0 pytest-cov==7.1.0 coverage==7.17.2
          echo "HUSHRUN_TEST_PYTHON=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_TOOLS=required" >> "$GITHUB_ENV"
      # Python's unittest and Django (ADR 0110): Django for the tests of `manage.py test`, which fail
      # rather than pass without it when HUSHRUN_TEST_TOOLS is `required`; unittest is the Python's.
      - name: Install Django for the unittest adapter's tests
        run: |
          python3 -m venv "$RUNNER_TEMP/django"
          "$RUNNER_TEMP/django/bin/pip" install --quiet django==6.1.3
          echo "HUSHRUN_TEST_DJANGO=$RUNNER_TEMP/django/bin/python" >> "$GITHUB_ENV"
      # Go and Vitest for the tests of the Go and Vitest adapters (ADR 0070, 0071), pinned: those
      # tests fail rather than pass without them when HUSHRUN_TEST_TOOLS is `required`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.20.2"
      - name: Install Vitest for the test-file tests
        run: |
          npm install --prefix "$RUNNER_TEMP/vitest" --no-audit --no-fund --ignore-scripts vitest@4.1.12 typescript@5.9.3 @types/node@26.6.6
          echo "HUSHRUN_TEST_VITEST=$RUNNER_TEMP/vitest/node_modules" >> "$GITHUB_ENV"
      # Svelte: Svelte 5, vite-plugin-svelte, SvelteKit 2, Testing Library and jsdom beside Vitest,
      # pinned, for the tests of Svelte's components and SvelteKit (ADR 0109). SvelteKit 3 and
      # jsdom 31 need Node 22; npm's peer resolution fails on this set without --legacy-peer-deps.
      - name: Install Svelte for the Svelte component tests
        run: |
          npm install --prefix "$RUNNER_TEMP/svelte" --no-audit --no-fund --ignore-scripts --legacy-peer-deps vitest@4.1.12 vite@7.3.8 svelte@5.59.1 @sveltejs/vite-plugin-svelte@6.2.4 @sveltejs/kit@2.70.4 @testing-library/svelte@5.4.2 jsdom@26.1.0
          echo "HUSHRUN_TEST_SVELTE=$RUNNER_TEMP/svelte/node_modules" >> "$GITHUB_ENV"
      # CMake and Ninja, which GitHub's runners have, for the CTest adapter's tests (ADR 0090).
      - name: Name CMake for the test-program tests
        run: echo "HUSHRUN_TEST_CMAKE=$(dirname "$(command -v cmake)"):$(dirname "$(command -v ninja)")" >> "$GITHUB_ENV"
      # C++: GoogleTest, Catch2 3 and doctest for the tests of test programs started directly, and
      # clang's module scanner for C++20 modules through the launcher (ADR 0120).
      - name: Install GoogleTest, Catch2 and clang-tools for the C++ tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtest-dev catch2 doctest-dev clang clang-tools
          echo "HUSHRUN_TEST_CXX_TESTS=1" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_CXX_MODULES=1" >> "$GITHUB_ENV"
      # C without CMake (ADR 0119): autoconf and automake for the autotools build test, and Meson,
      # pinned, for the Meson build and `meson test` adapter tests.
      - name: Install autotools and Meson for the C tests
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get install -y --no-install-recommends autoconf automake; else brew install autoconf automake; fi
          "$RUNNER_TEMP/py/bin/pip" install --quiet meson==1.3.2
          echo "HUSHRUN_TEST_MESON=$RUNNER_TEMP/py/bin/meson" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_AUTOTOOLS=$(dirname "$(command -v autoreconf)")" >> "$GITHUB_ENV"
      # The runner's own Swift for the tests of the swift test adapter (ADR 0089).
      - name: Name Swift for the test-target tests
        run: echo "HUSHRUN_TEST_SWIFT=$(command -v swift)" >> "$GITHUB_ENV"
      # A JDK and Maven, pinned, for the tests of the Maven adapter (ADR 0088), which run Maven
      # offline against a local repository, as the Maven build-block tests do (ADR 0113): filled by
      # running those tests online, then kept in Actions' cache under what decides what they
      # download (their fixtures, the adapter and build blocks, the JVM jars, Maven's version, the
      # runner). A hit skips the online runs, which otherwise ran both test binaries outside
      # hushrun on every run, a docs-only pull request's too (5 to 6 minutes). Only a fill whose
      # tests all passed online is kept. A Maven test that fails offline for want of an artifact
      # means the key misses a file that decides it: add it below.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Install Maven for the test-class tests
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | shasum -a 512 -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "HUSHRUN_TEST_MAVEN=$RUNNER_TEMP/apache-maven-3.9.16/bin/mvn" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_MAVEN_REPO=$RUNNER_TEMP/m2" >> "$GITHUB_ENV"
      - name: Restore Maven's repository for the test-class tests
        id: maven-repo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: maven-repo-v1-${{ runner.os }}-${{ runner.arch }}-maven-3.9.16-jdk-21.0.11-${{ hashFiles('crates/hushrun/tests/units_maven.rs', 'crates/hushrun/tests/e2e_maven.rs', 'crates/hushrun/tests/build_maven.rs', 'crates/hushrun/tests/common/**', 'crates/hushrun-build/src/maven/**', 'crates/hushrun/src/units/maven.rs', 'crates/hushrun/src/units/maven/**', 'crates/hushrun/src/units/jvm.rs', 'crates/hushrun/jvm/**', 'testdata/maven/**') }}
      - name: Fill Maven's repository for the test-class tests
        id: maven-fill
        if: steps.maven-repo.outputs.cache-hit != 'true'
        run: |
          filled=true
          HUSHRUN_TEST_MAVEN_ONLINE=1 cargo nextest run -p hushrun --test units_maven --test e2e_maven --locked --no-fail-fast || {
            filled=false
            echo "filling Maven's repository failed: the test run says what is missing, and the cache keeps none of it"
          }
          # Java (ADR 0113): and the build cache extension and plugins of the Maven build-block tests.
          HUSHRUN_TEST_MAVEN_ONLINE=1 cargo nextest run -p hushrun --test build_maven --locked --no-fail-fast || {
            filled=false
            echo "filling Maven's repository for build_maven failed: the test run says what is missing, and the cache keeps none of it"
          }
          echo "filled=$filled" >> "$GITHUB_OUTPUT"
      - name: Keep Maven's repository for the next runs
        if: steps.maven-fill.outputs.filled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: ${{ steps.maven-repo.outputs.cache-primary-key }}
      # Gradle for the tests of the Gradle adapter (ADR 0087), pinned and checked against Gradle's
      # published checksum, and a Gradle user home filled by running those tests online and kept
      # in Actions' cache, as Maven's repository is: what they need is their own builds (JUnit 5
      # and 4, TestNG, Spock, Kotest, Android's Gradle plugin), never a list beside them. The tests
      # then run offline. A hit skips the online run (5 to 7 minutes); the key holds whether
      # the Android SDK is here, since the fill downloads Android's plugin only then.
      # The Android test runs against the runner's own SDK (`ANDROID_HOME`) when it holds the
      # platform the test compiles for, android-36; otherwise this job opts out of it by name
      # (`HUSHRUN_TEST_ANDROID=skip`) and says so, since under `required` a missing SDK fails it.
      # Kotlin (ADR 0117): Kotlin/Native's test runs here, on Linux x86-64 only, since its
      # toolchain (hundreds of megabytes from download.jetbrains.com) lands in the Gradle user
      # home's `hushrun-konan` when that home is filled online.
      - name: Opt in to the Kotlin/Native test-class test
        run: echo "HUSHRUN_TEST_KOTLIN_NATIVE=1" >> "$GITHUB_ENV"
      - name: Install Gradle for the test-class tests
        id: gradle
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLO https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          echo "$(curl -sSfL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip.sha256)  gradle-9.3.1-bin.zip" | shasum -a 256 -c
          unzip -q gradle-9.3.1-bin.zip
          echo "HUSHRUN_TEST_GRADLE=$RUNNER_TEMP/gradle-9.3.1/bin/gradle" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "HUSHRUN_TEST_ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "android=android-36" >> "$GITHUB_OUTPUT"
          else
            echo "No Android SDK with android-36 here: the Android test is skipped by name (HUSHRUN_TEST_ANDROID=skip)"
            echo "HUSHRUN_TEST_ANDROID=skip" >> "$GITHUB_ENV"
            echo "android=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Gradle's user home for the test-class tests
        id: gradle-home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gradle-home
            !${{ runner.temp }}/gradle-home/daemon
          key: gradle-home-v1-${{ runner.os }}-${{ runner.arch }}-gradle-9.3.1-jdk-21.0.11-${{ steps.gradle.outputs.android }}-${{ hashFiles('crates/hushrun/tests/units_gradle.rs', 'crates/hushrun/tests/e2e_gradle.rs', 'crates/hushrun/tests/common/**', 'crates/hushrun/src/units/gradle.rs', 'crates/hushrun/src/units/gradle/**', 'crates/hushrun/src/units/hushrun_gradle.gradle', 'crates/hushrun/src/units/jvm.rs', 'crates/hushrun/jvm/**', 'testdata/gradle/**') }}
      - name: Fill Gradle's user home for the test-class tests
        id: gradle-fill
        if: steps.gradle-home.outputs.cache-hit != 'true'
        run: |
          if HUSHRUN_TEST_GRADLE_ONLINE=1 cargo nextest run -p hushrun --test units_gradle --test e2e_gradle --locked --no-fail-fast; then
            echo "filled=true" >> "$GITHUB_OUTPUT"
          else
            echo "filling Gradle's user home failed: the test run says what is missing, and the cache keeps none of it"
          fi
          # The fill's daemons stop, so that nothing writes to the home while it is saved.
          GRADLE_USER_HOME="$HUSHRUN_TEST_GRADLE_USER_HOME" "$HUSHRUN_TEST_GRADLE" --stop || true
      - name: Keep Gradle's user home for the next runs
        if: steps.gradle-fill.outputs.filled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gradle-home
            !${{ runner.temp }}/gradle-home/daemon
          key: ${{ steps.gradle-home.outputs.cache-primary-key }}
      # Jest 29 and 30 for the tests of the Jest adapter (ADR 0085), with ts-jest for its type check.
      - name: Install Jest for the test-file tests
        run: |
          npm install --prefix "$RUNNER_TEMP/jest29" --no-audit --no-fund --ignore-scripts jest@29.7.0 ts-jest@29.4.15 typescript@5.9.3
          npm install --prefix "$RUNNER_TEMP/jest30" --no-audit --no-fund --ignore-scripts jest@30.5.2 ts-jest@29.4.15 typescript@5.9.3
          echo "HUSHRUN_TEST_JEST29=$RUNNER_TEMP/jest29/node_modules" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_JEST30=$RUNNER_TEMP/jest30/node_modules" >> "$GITHUB_ENV"
      # Vue: Vitest with @vitejs/plugin-vue and Jest with @vue/vue3-jest, for the tests of Vue's
      # components (ADR 0108). --legacy-peer-deps: Vitest's optional peers trip npm's resolver.
      - name: Install Vue's test tools for the component tests
        run: |
          npm install --prefix "$RUNNER_TEMP/vue" --no-audit --no-fund --ignore-scripts --legacy-peer-deps vitest@4.1.12 vue@3.5.46 @vitejs/plugin-vue@6.0.11 @vue/test-utils@2.6.0 jsdom@26.1.0 typescript@5.9.3
          npm install --prefix "$RUNNER_TEMP/vue-jest" --no-audit --no-fund --ignore-scripts --legacy-peer-deps jest@29.7.0 jest-environment-jsdom@29.7.0 @vue/vue3-jest@29.2.6 babel-jest@29.7.0 @babel/core@7.29.13 @babel/preset-env@7.29.14 vue@3.5.46 @vue/test-utils@2.6.0 typescript@5.9.3
          echo "HUSHRUN_TEST_VUE=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_VUE_JEST=$RUNNER_TEMP/vue-jest/node_modules" >> "$GITHUB_ENV"
      # JavaScript: Node 22 and 24, pinned, from nodejs.org beside the Node 20 above, and Mocha 10
      # and 11, for the tests of the adapters for Node's test runner and Mocha (ADR 0107).
      - name: Install Node 22 and 24 and Mocha for the test-file tests
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) platform=darwin-x64 ;;
          esac
          for version in 22.20.0 24.11.0; do
            curl -fsSL --retry 3 "https://nodejs.org/dist/v$version/node-v$version-$platform.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          done
          echo "HUSHRUN_TEST_NODE22=$RUNNER_TEMP/node-v22.20.0-$platform/bin" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_NODE24=$RUNNER_TEMP/node-v24.11.0-$platform/bin" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/mocha10" --no-audit --no-fund --ignore-scripts mocha@10.8.2
          npm install --prefix "$RUNNER_TEMP/mocha11" --no-audit --no-fund --ignore-scripts mocha@11.7.5
          echo "HUSHRUN_TEST_MOCHA10=$RUNNER_TEMP/mocha10/node_modules" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_MOCHA11=$RUNNER_TEMP/mocha11/node_modules" >> "$GITHUB_ENV"
      # Elixir: Erlang/OTP and Elixir, pinned, for the tests of the ExUnit adapter (ADR 0122), which
      # fail rather than pass without them once HUSHRUN_TEST_MIX names the mix to use.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27.3.4"
          elixir-version: "1.18.4"
      - name: Name mix for the ExUnit tests
        run: echo "HUSHRUN_TEST_MIX=$(command -v mix)" >> "$GITHUB_ENV"
      # Ruby: RSpec, Minitest 6 and Minitest 5 for the tests of the Ruby adapter (ADR 0114), each
      # in a gem directory of its own, pinned.
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.3"
      - name: Install RSpec and Minitest for the test-file tests
        run: |
          gem install --no-document --install-dir "$RUNNER_TEMP/rubygems" rspec:3.13.2 minitest:6.1.0 rake:13.4.2
          gem install --no-document --install-dir "$RUNNER_TEMP/rubygems5" minitest:5.20.0 rake:13.4.2
          {
            echo "HUSHRUN_TEST_RUBY=$(command -v ruby)"
            echo "HUSHRUN_TEST_RUBY_GEMS=$RUNNER_TEMP/rubygems"
            echo "HUSHRUN_TEST_RUBY_GEMS5=$RUNNER_TEMP/rubygems5"
          } >> "$GITHUB_ENV"
      # TypeScript: TypeScript 6 for the tests of tsc's build blocks (ADR 0106), pinned.
      - name: Install TypeScript for the tsc build-block tests
        run: |
          npm install --prefix "$RUNNER_TEMP/tsc" --no-audit --no-fund --ignore-scripts typescript@6.0.3
          echo "HUSHRUN_TEST_TSC=$RUNNER_TEMP/tsc/node_modules" >> "$GITHUB_ENV"
      # Shell: bats-core 1.10 and 1.13 for the tests of the Bats adapter (ADR 0115), pinned.
      - name: Install Bats for the test-file tests
        run: |
          npm install --prefix "$RUNNER_TEMP/bats110" --no-audit --no-fund --ignore-scripts bats@1.10.0
          npm install --prefix "$RUNNER_TEMP/bats113" --no-audit --no-fund --ignore-scripts bats@1.13.0
          echo "HUSHRUN_TEST_BATS=$RUNNER_TEMP/bats110/node_modules/.bin:$RUNNER_TEMP/bats113/node_modules/.bin" >> "$GITHUB_ENV"
      # C# (.NET): the runner's own .NET SDK for the tests of the dotnet test adapter (ADR 0118),
      # whose fixtures target its major version and restore their pinned NuGet packages from
      # nuget.org into a folder of their own.
      - name: Name .NET for the test-project tests
        run: |
          dotnet --info | head -n 20
          echo "HUSHRUN_TEST_DOTNET=$(command -v dotnet)" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_DOTNET_PACKAGES=$RUNNER_TEMP/nuget" >> "$GITHUB_ENV"
      # PHP: PHPUnit 10, 11 and 12 and Pest 3 and 4 for the tests of the PHPUnit adapter (ADR
      # 0116), pinned, each in a Composer project of its own outside the repository, run by the
      # runner's own PHP 8.3 and Composer.
      - name: Install PHPUnit and Pest for the test-file tests
        run: |
          set -euo pipefail
          for v in 10.5.67 11.5.58 12.5.45; do
            d="$RUNNER_TEMP/phpunit${v%%.*}"
            mkdir -p "$d"
            composer require --working-dir "$d" --no-interaction --no-progress --quiet --dev "phpunit/phpunit:$v"
            echo "HUSHRUN_TEST_PHPUNIT${v%%.*}=$d/vendor" >> "$GITHUB_ENV"
          done
          for v in 3.8.7 4.7.8; do
            d="$RUNNER_TEMP/pest${v%%.*}"
            mkdir -p "$d"
            echo '{"config": {"allow-plugins": {"pestphp/pest-plugin": true}}}' > "$d/composer.json"
            composer require --working-dir "$d" --no-interaction --no-progress --quiet --dev "pestphp/pest:$v"
            echo "HUSHRUN_TEST_PEST${v%%.*}=$d/vendor" >> "$GITHUB_ENV"
          done
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run test -- cargo nextest run --workspace --locked --no-tests=pass
      - run: hushrun run doctest -- cargo test --workspace --doc --locked

  # The independent Python references agree with the golden vectors (D-1 … D-8), the unit key
  # vectors (C-31), the hint vectors (C-38), the Ed25519 and DSSE test vectors (E-1, E-2) and the
  # report vectors (C-27) on every OS.
  reference:
    name: refdigest.py (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I tools/refdigest.py vectors testdata/digest/vectors.json
      - run: python3 -I tools/refdigest.py globs testdata/digest/globs.json
      - run: python3 -I tools/refdigest.py unit-keys testdata/digest/unit-keys.json
      - run: python3 -I tools/refdigest.py unit-hints testdata/digest/unit-hints.json
      - run: python3 -I tools/refdsse.py selftest
      - run: python3 -I tools/reftlog.py selftest
      - run: python3 -I tools/reftlog.py check testdata/tlog/vectors.json
      - run: python3 -I tools/refreports.py check testdata/reports/vectors.json

  # The npm packages (npm/): the platform mapping, bin/hushrun.js and the build; and the bundle
  # skills marketplaces read (recipes/agents/bundle.mjs, ADR 0066).
  npm:
    name: npm packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test npm/test/*.test.mjs
        shell: bash
      - run: node --test recipes/agents/*.test.mjs
        shell: bash

  # The same checks on macOS. clippy and the tests run as `clippy-macos`, `test-macos` and
  # `doctest-macos`, whose rule in hushrun.yaml is `os: macos`: a pass here skips this job's next
  # run on the same code, and nothing on Linux skips on it, nor the other way round. The Python
  # references and the npm tests take seconds, and run every time. Like `test`, `test-macos`
  # reuses whole test binaries: every integration test of crates/hushrun starts the hushrun binary
  # and so reads all of crates/hushrun/src, and a change there runs all of them here, about 45
  # minutes. Which change runs what, and how to keep a pull request from it: CONTRIBUTING.md,
  # "Which tests CI runs again".
  macos:
    name: clippy, test, references, npm (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Install pytest for the test-file tests
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet pytest==8.4.2 pytest-xdist==3.8.0 pytest-cov==7.1.0 coverage==7.17.2
          echo "HUSHRUN_TEST_PYTHON=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_TOOLS=required" >> "$GITHUB_ENV"
      # Python's unittest and Django (ADR 0110): Django for the tests of `manage.py test`, which fail
      # rather than pass without it when HUSHRUN_TEST_TOOLS is `required`; unittest is the Python's.
      - name: Install Django for the unittest adapter's tests
        run: |
          python3 -m venv "$RUNNER_TEMP/django"
          "$RUNNER_TEMP/django/bin/pip" install --quiet django==6.1.3
          echo "HUSHRUN_TEST_DJANGO=$RUNNER_TEMP/django/bin/python" >> "$GITHUB_ENV"
      # Go and Vitest for the tests of the Go and Vitest adapters (ADR 0070, 0071), pinned: those
      # tests fail rather than pass without them when HUSHRUN_TEST_TOOLS is `required`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.20.2"
      - name: Install Vitest for the test-file tests
        run: |
          npm install --prefix "$RUNNER_TEMP/vitest" --no-audit --no-fund --ignore-scripts vitest@4.1.12 typescript@5.9.3 @types/node@26.6.6
          echo "HUSHRUN_TEST_VITEST=$RUNNER_TEMP/vitest/node_modules" >> "$GITHUB_ENV"
      # Svelte: Svelte 5, vite-plugin-svelte, SvelteKit 2, Testing Library and jsdom beside Vitest,
      # pinned, for the tests of Svelte's components and SvelteKit (ADR 0109). SvelteKit 3 and
      # jsdom 31 need Node 22; npm's peer resolution fails on this set without --legacy-peer-deps.
      - name: Install Svelte for the Svelte component tests
        run: |
          npm install --prefix "$RUNNER_TEMP/svelte" --no-audit --no-fund --ignore-scripts --legacy-peer-deps vitest@4.1.12 vite@7.3.8 svelte@5.59.1 @sveltejs/vite-plugin-svelte@6.2.4 @sveltejs/kit@2.70.4 @testing-library/svelte@5.4.2 jsdom@26.1.0
          echo "HUSHRUN_TEST_SVELTE=$RUNNER_TEMP/svelte/node_modules" >> "$GITHUB_ENV"
      # CMake and Ninja, which GitHub's runners have, for the CTest adapter's tests (ADR 0090).
      - name: Name CMake for the test-program tests
        run: echo "HUSHRUN_TEST_CMAKE=$(dirname "$(command -v cmake)"):$(dirname "$(command -v ninja)")" >> "$GITHUB_ENV"
      # C without CMake (ADR 0119): autoconf and automake for the autotools build test, and Meson,
      # pinned, for the Meson build and `meson test` adapter tests.
      - name: Install autotools and Meson for the C tests
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get install -y --no-install-recommends autoconf automake; else brew install autoconf automake; fi
          "$RUNNER_TEMP/py/bin/pip" install --quiet meson==1.3.2
          echo "HUSHRUN_TEST_MESON=$RUNNER_TEMP/py/bin/meson" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_AUTOTOOLS=$(dirname "$(command -v autoreconf)")" >> "$GITHUB_ENV"
      # The runner's own Swift for the tests of the swift test adapter (ADR 0089).
      - name: Name Swift for the test-target tests
        run: echo "HUSHRUN_TEST_SWIFT=$(command -v swift)" >> "$GITHUB_ENV"
      # Swift (ADR 0121): the runner's own Xcode for the tests of the xcodebuild test adapter.
      - name: Name Xcode for the xcodebuild test-target tests
        run: echo "HUSHRUN_TEST_XCODEBUILD=$(command -v xcodebuild)" >> "$GITHUB_ENV"
      # A JDK and Maven, pinned, for the tests of the Maven adapter (ADR 0088), which run Maven
      # offline against a local repository, as the Maven build-block tests do (ADR 0113): filled by
      # running those tests online, then kept in Actions' cache under what decides what they
      # download (their fixtures, the adapter and build blocks, the JVM jars, Maven's version, the
      # runner). A hit skips the online runs, which otherwise ran both test binaries outside
      # hushrun on every run, a docs-only pull request's too (5 to 6 minutes). Only a fill whose
      # tests all passed online is kept. A Maven test that fails offline for want of an artifact
      # means the key misses a file that decides it: add it below.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.11"
      - name: Install Maven for the test-class tests
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | shasum -a 512 -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "HUSHRUN_TEST_MAVEN=$RUNNER_TEMP/apache-maven-3.9.16/bin/mvn" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_MAVEN_REPO=$RUNNER_TEMP/m2" >> "$GITHUB_ENV"
      - name: Restore Maven's repository for the test-class tests
        id: maven-repo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: maven-repo-v1-${{ runner.os }}-${{ runner.arch }}-maven-3.9.16-jdk-21.0.11-${{ hashFiles('crates/hushrun/tests/units_maven.rs', 'crates/hushrun/tests/e2e_maven.rs', 'crates/hushrun/tests/build_maven.rs', 'crates/hushrun/tests/common/**', 'crates/hushrun-build/src/maven/**', 'crates/hushrun/src/units/maven.rs', 'crates/hushrun/src/units/maven/**', 'crates/hushrun/src/units/jvm.rs', 'crates/hushrun/jvm/**', 'testdata/maven/**') }}
      - name: Fill Maven's repository for the test-class tests
        id: maven-fill
        if: steps.maven-repo.outputs.cache-hit != 'true'
        run: |
          filled=true
          HUSHRUN_TEST_MAVEN_ONLINE=1 cargo nextest run -p hushrun --test units_maven --test e2e_maven --locked --no-fail-fast || {
            filled=false
            echo "filling Maven's repository failed: the test run says what is missing, and the cache keeps none of it"
          }
          # Java (ADR 0113): and the build cache extension and plugins of the Maven build-block tests.
          HUSHRUN_TEST_MAVEN_ONLINE=1 cargo nextest run -p hushrun --test build_maven --locked --no-fail-fast || {
            filled=false
            echo "filling Maven's repository for build_maven failed: the test run says what is missing, and the cache keeps none of it"
          }
          echo "filled=$filled" >> "$GITHUB_OUTPUT"
      - name: Keep Maven's repository for the next runs
        if: steps.maven-fill.outputs.filled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/m2
          key: ${{ steps.maven-repo.outputs.cache-primary-key }}
      # Gradle for the tests of the Gradle adapter (ADR 0087), pinned and checked against Gradle's
      # published checksum, and a Gradle user home filled by running those tests online and kept
      # in Actions' cache, as Maven's repository is: what they need is their own builds (JUnit 5
      # and 4, TestNG, Spock, Kotest, Android's Gradle plugin), never a list beside them. The tests
      # then run offline. A hit skips the online run (5 to 7 minutes); the key holds whether
      # the Android SDK is here, since the fill downloads Android's plugin only then.
      # The Android test runs against the runner's own SDK (`ANDROID_HOME`) when it holds the
      # platform the test compiles for, android-36; otherwise this job opts out of it by name
      # (`HUSHRUN_TEST_ANDROID=skip`) and says so, since under `required` a missing SDK fails it.
      - name: Install Gradle for the test-class tests
        id: gradle
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLO https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          echo "$(curl -sSfL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip.sha256)  gradle-9.3.1-bin.zip" | shasum -a 256 -c
          unzip -q gradle-9.3.1-bin.zip
          echo "HUSHRUN_TEST_GRADLE=$RUNNER_TEMP/gradle-9.3.1/bin/gradle" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "HUSHRUN_TEST_ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "android=android-36" >> "$GITHUB_OUTPUT"
          else
            echo "No Android SDK with android-36 here: the Android test is skipped by name (HUSHRUN_TEST_ANDROID=skip)"
            echo "HUSHRUN_TEST_ANDROID=skip" >> "$GITHUB_ENV"
            echo "android=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Gradle's user home for the test-class tests
        id: gradle-home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gradle-home
            !${{ runner.temp }}/gradle-home/daemon
          key: gradle-home-v1-${{ runner.os }}-${{ runner.arch }}-gradle-9.3.1-jdk-21.0.11-${{ steps.gradle.outputs.android }}-${{ hashFiles('crates/hushrun/tests/units_gradle.rs', 'crates/hushrun/tests/e2e_gradle.rs', 'crates/hushrun/tests/common/**', 'crates/hushrun/src/units/gradle.rs', 'crates/hushrun/src/units/gradle/**', 'crates/hushrun/src/units/hushrun_gradle.gradle', 'crates/hushrun/src/units/jvm.rs', 'crates/hushrun/jvm/**', 'testdata/gradle/**') }}
      - name: Fill Gradle's user home for the test-class tests
        id: gradle-fill
        if: steps.gradle-home.outputs.cache-hit != 'true'
        run: |
          if HUSHRUN_TEST_GRADLE_ONLINE=1 cargo nextest run -p hushrun --test units_gradle --test e2e_gradle --locked --no-fail-fast; then
            echo "filled=true" >> "$GITHUB_OUTPUT"
          else
            echo "filling Gradle's user home failed: the test run says what is missing, and the cache keeps none of it"
          fi
          # The fill's daemons stop, so that nothing writes to the home while it is saved.
          GRADLE_USER_HOME="$HUSHRUN_TEST_GRADLE_USER_HOME" "$HUSHRUN_TEST_GRADLE" --stop || true
      - name: Keep Gradle's user home for the next runs
        if: steps.gradle-fill.outputs.filled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gradle-home
            !${{ runner.temp }}/gradle-home/daemon
          key: ${{ steps.gradle-home.outputs.cache-primary-key }}
      # Jest 29 and 30 for the tests of the Jest adapter (ADR 0085), with ts-jest for its type check.
      - name: Install Jest for the test-file tests
        run: |
          npm install --prefix "$RUNNER_TEMP/jest29" --no-audit --no-fund --ignore-scripts jest@29.7.0 ts-jest@29.4.15 typescript@5.9.3
          npm install --prefix "$RUNNER_TEMP/jest30" --no-audit --no-fund --ignore-scripts jest@30.5.2 ts-jest@29.4.15 typescript@5.9.3
          echo "HUSHRUN_TEST_JEST29=$RUNNER_TEMP/jest29/node_modules" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_JEST30=$RUNNER_TEMP/jest30/node_modules" >> "$GITHUB_ENV"
      # Vue: Vitest with @vitejs/plugin-vue and Jest with @vue/vue3-jest, for the tests of Vue's
      # components (ADR 0108). --legacy-peer-deps: Vitest's optional peers trip npm's resolver.
      - name: Install Vue's test tools for the component tests
        run: |
          npm install --prefix "$RUNNER_TEMP/vue" --no-audit --no-fund --ignore-scripts --legacy-peer-deps vitest@4.1.12 vue@3.5.46 @vitejs/plugin-vue@6.0.11 @vue/test-utils@2.6.0 jsdom@26.1.0 typescript@5.9.3
          npm install --prefix "$RUNNER_TEMP/vue-jest" --no-audit --no-fund --ignore-scripts --legacy-peer-deps jest@29.7.0 jest-environment-jsdom@29.7.0 @vue/vue3-jest@29.2.6 babel-jest@29.7.0 @babel/core@7.29.13 @babel/preset-env@7.29.14 vue@3.5.46 @vue/test-utils@2.6.0 typescript@5.9.3
          echo "HUSHRUN_TEST_VUE=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_VUE_JEST=$RUNNER_TEMP/vue-jest/node_modules" >> "$GITHUB_ENV"
      # JavaScript: Node 22 and 24, pinned, from nodejs.org beside the Node 20 above, and Mocha 10
      # and 11, for the tests of the adapters for Node's test runner and Mocha (ADR 0107).
      - name: Install Node 22 and 24 and Mocha for the test-file tests
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *) platform=darwin-x64 ;;
          esac
          for version in 22.20.0 24.11.0; do
            curl -fsSL --retry 3 "https://nodejs.org/dist/v$version/node-v$version-$platform.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          done
          echo "HUSHRUN_TEST_NODE22=$RUNNER_TEMP/node-v22.20.0-$platform/bin" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_NODE24=$RUNNER_TEMP/node-v24.11.0-$platform/bin" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/mocha10" --no-audit --no-fund --ignore-scripts mocha@10.8.2
          npm install --prefix "$RUNNER_TEMP/mocha11" --no-audit --no-fund --ignore-scripts mocha@11.7.5
          echo "HUSHRUN_TEST_MOCHA10=$RUNNER_TEMP/mocha10/node_modules" >> "$GITHUB_ENV"
          echo "HUSHRUN_TEST_MOCHA11=$RUNNER_TEMP/mocha11/node_modules" >> "$GITHUB_ENV"
      # Ruby: RSpec, Minitest 6 and Minitest 5 for the tests of the Ruby adapter (ADR 0114), each
      # in a gem directory of its own, pinned.
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.3"
      - name: Install RSpec and Minitest for the test-file tests
        run: |
          gem install --no-document --install-dir "$RUNNER_TEMP/rubygems" rspec:3.13.2 minitest:6.1.0 rake:13.4.2
          gem install --no-document --install-dir "$RUNNER_TEMP/rubygems5" minitest:5.20.0 rake:13.4.2
          {
            echo "HUSHRUN_TEST_RUBY=$(command -v ruby)"
            echo "HUSHRUN_TEST_RUBY_GEMS=$RUNNER_TEMP/rubygems"
            echo "HUSHRUN_TEST_RUBY_GEMS5=$RUNNER_TEMP/rubygems5"
          } >> "$GITHUB_ENV"
      # TypeScript: TypeScript 6 for the tests of tsc's build blocks (ADR 0106), pinned.
      - name: Install TypeScript for the tsc build-block tests
        run: |
          npm install --prefix "$RUNNER_TEMP/tsc" --no-audit --no-fund --ignore-scripts typescript@6.0.3
          echo "HUSHRUN_TEST_TSC=$RUNNER_TEMP/tsc/node_modules" >> "$GITHUB_ENV"
      # Shell: bats-core 1.10 and 1.13 for the tests of the Bats adapter (ADR 0115), pinned.
      - name: Install Bats for the test-file tests
        run: |
          npm install --prefix "$RUNNER_TEMP/bats110" --no-audit --no-fund --ignore-scripts bats@1.10.0
          npm install --prefix "$RUNNER_TEMP/bats113" --no-audit --no-fund --ignore-scripts bats@1.13.0
          echo "HUSHRUN_TEST_BATS=$RUNNER_TEMP/bats110/node_modules/.bin:$RUNNER_TEMP/bats113/node_modules/.bin" >> "$GITHUB_ENV"
      # PHP: the PHPUnit adapter's tests (ADR 0116) run on Linux, whose runner has PHP and
      # Composer; this job opts out of them by name, since under `required` they fail without PHP.
      - name: Skip the PHPUnit and Pest tests here
        run: echo "HUSHRUN_TEST_PHP=skip" >> "$GITHUB_ENV"
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run clippy-macos -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: hushrun run test-macos -- cargo nextest run --workspace --locked --no-tests=pass
      - run: hushrun run doctest-macos -- cargo test --workspace --doc --locked
      - run: python3 -I tools/refdigest.py vectors testdata/digest/vectors.json
      - run: python3 -I tools/refdigest.py globs testdata/digest/globs.json
      - run: python3 -I tools/refdigest.py unit-keys testdata/digest/unit-keys.json
      - run: python3 -I tools/refdigest.py unit-hints testdata/digest/unit-hints.json
      - run: python3 -I tools/refdsse.py selftest
      - run: python3 -I tools/reftlog.py selftest
      - run: python3 -I tools/reftlog.py check testdata/tlog/vectors.json
      - run: python3 -I tools/refreports.py check testdata/reports/vectors.json
      - run: node --test npm/test/*.test.mjs
      - run: node --test recipes/agents/*.test.mjs

  # Envelope, statement and policy parsing under libFuzzer, 60 s each (M2), M10's
  # certificates, timestamps, TUF metadata and trust roots, test and coverage reports (C-27), and
  # hints from a server (C-38). The fuzzing runs on every push, since its inputs are random. One
  # job builds the six targets once and fuzzes them in turn, each with the runner to itself, as
  # when each had its own job.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    env:
      # rust-cache runs cargo in fuzz/, where rust-toolchain.toml would make rustup install the
      # pinned stable, which nothing here uses.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - id: cargo-fuzz
        run: echo "version=$(cargo fuzz --version | tr ' ' -)" >> "$GITHUB_OUTPUT"
      # Caches the third-party crates' sanitizer build. rust-cache's key holds every installed
      # toolchain's version (so this nightly's) and fuzz/Cargo.lock, and here cargo-fuzz's version,
      # which sets the instrumentation flags. cargo rebuilds anything whose compiler, flags or
      # sources differ anyway, so the CLI's own crates build every time. Only main saves it: pull
      # requests' copies would crowd the repository's 10 GB of cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ steps.cargo-fuzz.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Seed the corpus
        run: |
          mkdir -p fuzz/corpus/policy
          for f in testdata/policies/*.yaml; do cp "$f" "fuzz/corpus/policy/policy-$(basename "$f")"; done
          mkdir -p fuzz/corpus/envelope fuzz/corpus/statement fuzz/corpus/sigstore
          cp testdata/sigstore/*.der crates/hushrun-attest/sigstore/*.json fuzz/corpus/sigstore/
          mkdir -p fuzz/corpus/reports
          for f in testdata/reports/*/*; do cp "$f" "fuzz/corpus/reports/$(basename "$(dirname "$f")")-$(basename "$f")"; done
          python3 -I tools/refdigest.py unit-hints testdata/digest/unit-hints.json --corpus fuzz/corpus/hints
      # cargo-fuzz builds for the target it was itself built for unless given one, and the one
      # install-action installs is a musl build: musl links libc statically, which the sanitizer
      # can't work with. The fuzz targets build for the runner's own target.
      - id: build
        name: Build the fuzz targets
        run: |
          host="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          echo "FUZZ_HOST=$host" >> "$GITHUB_ENV"
          cargo +nightly fuzz build --target "$host"
      # Every target runs even after one fails, so a push reports all of them.
      - name: Fuzz envelope
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +nightly fuzz run --target "$FUZZ_HOST" envelope fuzz/corpus/envelope -- -max_total_time=60
      - name: Fuzz statement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +nightly fuzz run --target "$FUZZ_HOST" statement fuzz/corpus/statement -- -max_total_time=60
      - name: Fuzz policy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +nightly fuzz run --target "$FUZZ_HOST" policy fuzz/corpus/policy -- -max_total_time=60
      - name: Fuzz sigstore
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +nightly fuzz run --target "$FUZZ_HOST" sigstore fuzz/corpus/sigstore -- -max_total_time=60
      - name: Fuzz reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +nightly fuzz run --target "$FUZZ_HOST" reports fuzz/corpus/reports -- -max_total_time=60
      - name: Fuzz hints
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo +nightly fuzz run --target "$FUZZ_HOST" hints fuzz/corpus/hints -- -max_total_time=60
      - name: Fuzz block_pack
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p fuzz/corpus/block_pack
          cargo +nightly fuzz run --target "$FUZZ_HOST" block_pack fuzz/corpus/block_pack -- -max_total_time=60
      # cargo-fuzz writes each target's crashes under its own name in fuzz/artifacts.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # OCI copies (A-1 … A-4) between two registry implementations, CNCF Distribution and zot,
  # pinned by digest (M5): Distribution is the source, zot the destination.
  registries:
    name: OCI conformance (Distribution, zot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start the registries
        run: |
          docker run -d --name distribution -p 5001:5000 \
            registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          docker run -d --name zot -p 5002:5000 \
            ghcr.io/project-zot/zot-linux-amd64:v2.1.22@sha256:46f688dc26315a35a247e1784368829e66a67bf91de94c7d8d1645044fac1d5b
          for port in 5001 5002; do
            timeout 60 sh -c "until curl -fs http://127.0.0.1:$port/v2/ >/dev/null; do sleep 1; done"
          done
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      # HUSHRUN_IT_REGISTRIES is part of each command, so of what a pass is for: without it the
      # tests find nothing to test and pass, and such a pass must never skip these.
      - run: hushrun run registries -- env "HUSHRUN_IT_REGISTRIES=127.0.0.1:5001 127.0.0.1:5002" cargo test --locked -p hushrun-artifact --features it --test registries -- --nocapture
      - run: hushrun run artifact-registries -- env "HUSHRUN_IT_REGISTRIES=127.0.0.1:5001 127.0.0.1:5002" cargo test --locked -p hushrun --features it --test artifact_registries -- --nocapture
      - if: failure()
        run: docker logs distribution; docker logs zot

  # Public-good Sigstore (M10): a timestamp from its timestamp authority, a TUF refresh of its
  # trust root from the vendored one, and a Fulcio certificate for this job's own ID token
  # (skipped where GitHub gives no ID token, such as pull requests from forks).
  sigstore:
    name: public-good Sigstore
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # hushrun: leave, public-good Sigstore changes while the code doesn't
      - run: cargo test --locked -p hushrun-attest --features it --test sigstore -- --nocapture

  # Isolated runs with a real container runtime (E-12, M8): no network by default, exactly the
  # digested files, only the check's variables, and the export removed afterwards.
  isolated:
    name: isolated runs (Docker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run isolated -- cargo test --locked -p hushrun --features it --test isolated_docker -- --nocapture

  # The recipes (§15), the reusable workflow, what `hushrun adopt` writes (its golden files) and
  # these workflows pass actionlint, with shellcheck on run scripts (M6, M14), and GitLab's
  # install script and the maintainers' scripts pass shellcheck (M9).
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" recipes/github/*.yml .github/workflows/*.yml testdata/adopt/*/.github/workflows/*.yml'
      - run: shellcheck -s sh recipes/gitlab/install-hushrun.sh scripts/verify.sh scripts/hooks/pre-push
      - run: shellcheck scripts/release.sh

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      # RUSTDOCFLAGS is part of the command, so of what a pass is for: rustdoc without -D warnings
      # passes on a broken link, and such a pass must never skip this one. hushrun's own crate is
      # a library its binary is a thin `main` over: it is documented with its private items, as
      # cargo documents a binary, so that every item's docs and links stay checked.
      - run: hushrun run rustdoc -- env RUSTDOCFLAGS=-Dwarnings sh -c 'cargo doc --workspace --exclude hushrun --no-deps --locked && cargo doc -p hushrun --no-deps --locked --document-private-items'

  trace:
    name: traceability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run trace -- cargo xtask trace

  # The JVM jars hushrun embeds (ADR 0088) are what their Java sources build: built again with the
  # JDK they were built with, against the API jars pinned by SHA-256, and compared byte for byte.
  jars:
    name: JVM jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21.0.11"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask jars --check

  # THIRD-PARTY-NOTICES.md names every crate the release binaries are built with, for every
  # release target, with its license texts: it must be what Cargo.lock gives.
  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: hushrun/hushrun/action/setup@0d6c719855fbae11fbf7495fa2d16b29ab0d8e31 # v0.9.0
      - run: hushrun run notices -- cargo xtask notices --check

  # Nothing that looks like a secret, a dead link or an oversized file (scripts/check-tree.py), and
  # nothing gitleaks or trufflehog find beyond the reviewed test fixtures (scripts/verify.sh). Every
  # push here is public at once, so these run on each one.
  tree:
    name: secrets and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What was pushed, without .git: the scanners' baseline is relative to the tree's root.
      - run: mkdir "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: python3 -I scripts/check-tree.py "$RUNNER_TEMP/tree"
      # Each scanner's release archive, pinned by its SHA-256.
      - name: Install gitleaks and trufflehog
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8/trufflehog_3.99.8_linux_amd64.tar.gz
          sha256sum -c - <<'SUMS'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz
          7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08  trufflehog_3.99.8_linux_amd64.tar.gz
          SUMS
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          tar -xzf trufflehog_3.99.8_linux_amd64.tar.gz -C "$RUNNER_TEMP/bin" trufflehog
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: sh scripts/verify.sh "$RUNNER_TEMP/tree"

  # The Linux release targets build on every change as release.yml (dist) builds them: natively,
  # with musl-tools, aarch64 on an arm64 runner. Each binary runs. release.yml builds the macOS and
  # Windows ones.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, image: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --package hushrun --target ${{ matrix.target }}
      - shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/hushrun
          "$bin" --version
          ls -l "$bin"*
      # The container image (§14, M9) with this binary: it runs, and reads a checkout that
      # another user owns, as a GitLab runner's can be.
      - if: matrix.image
        run: |
          set -euo pipefail
          mkdir -p target/image/dist/amd64
          cp target/${{ matrix.target }}/release/hushrun target/image/dist/amd64/
          cp LICENSE.md THIRD-PARTY-NOTICES.md target/image/
          docker build --platform linux/amd64 -f deploy/image/Dockerfile -t hushrun:ci target/image
          docker run --rm hushrun:ci hushrun --version
          docker run --rm hushrun:ci test -s /usr/share/licenses/hushrun/THIRD-PARTY-NOTICES.md
          docker run --rm hushrun:ci sh -euc '
            mkdir /builds && cd /builds && git init -q && echo hi > a.txt
            git -c user.name=ci -c user.email=ci@example.invalid add -A
            git -c user.name=ci -c user.email=ci@example.invalid commit -qm init
            chown -R 1000:1000 /builds
            hushrun digest --worktree && git ls-files'
