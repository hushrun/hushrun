# hushrun.yaml: where this repository's events go.
version: 1
repository: github.com/hushrun/hushrun
repository_url: https://api.hushrun.com/l/hushrun/hushrun
backend: https://api.hushrun.com/o/hushrun

transparency_log:   # the server's log key
  origin: api.hushrun.com/l/hushrun/hushrun
  key: "ed25519:lvZaTgsagmTcyMB8+XsOts2amd15aWRgkjoCslO9bIM="

# A check counts only from a run on CI's system, Linux on amd64, unless `checks` below says
# otherwise. A run on a Mac still runs and keeps its exit code, and records nothing, so it never
# skips a test or clippy in CI's Linux jobs.
counts_from:
  os: linux
  arch: amd64

# Checks a Mac's pass can stand in for, since they read the files and nothing of the system.
checks:
  fmt:
    counts_from: anywhere
  # The code is the same on macOS and Linux but for one private function, whose docs link nothing,
  # so rustdoc reads the same docs on both.
  rustdoc:
    counts_from: anywhere
  # The spec's rules against the tests, and the notices against Cargo.lock for every release
  # target.
  trace:
    counts_from: anywhere
  notices:
    counts_from: anywhere
  # CI's macOS job runs these under their own names, so that its pass skips its next run on the
  # same code and never one of the Linux checks above, nor they one of these.
  clippy-macos:
    counts_from:
      os: macos
  test-macos:
    counts_from:
      os: macos
    # Every test file runs as before; hushrun says which ones `tests: reuse` would have left out.
    # The ignore list is the same as `test`'s below, and says why.
    tests:
      mode: observe
      ignore:
        - docs/adr/**
        - docs/guides/**
        - docs/rfc/**
        - docs/spec/**
        - docs/validation/**
        - docs/plan.md
        - "*.md"
        - .agents/**
        - .claude/**
        - npm/**
        - fuzz/**
        - deploy/**
        - scripts/**
        - action/**
        - tools/corpus/**
        - deny.toml
        - clippy.toml
        - rustfmt.toml
        - hushrun.yaml
        - .github/actionlint.yaml
        - .github/dist-build-setup.yml
        - .github/workflows/ci.yml
        - .github/workflows/nightly.yml
        - .github/workflows/npm.yml
        - .github/workflows/publish.yml
        - .github/workflows/release.yml
        - .github/workflows/skills.yml
  doctest-macos:
    counts_from:
      os: macos
  # Linux's tests, which count only from CI's system, as above. Every test file runs as before,
  # and hushrun says which ones `tests: reuse` would have left out.
  test:
    # A change to a file below changes no test file's key. On 2026-11-17 a trace of every test
    # binary on Linux showed that no test opens, lists or compiles in any of them. Anything a test
    # compiles in or opens must stay out of this list: all of recipes/, testdata/, docs/schemas/,
    # tools/*.py, dist-workspace.toml and .github/workflows/hushrun-deploy.yml. A glob matches from
    # the root, so `*.md` is the root's own, and it can't leave one file out, so .github/ is named
    # file by file: a new file there counts until it is listed.
    tests:
      mode: observe
      ignore:
        - docs/adr/**
        - docs/guides/**
        - docs/rfc/**
        - docs/spec/**
        - docs/validation/**
        - docs/plan.md
        - "*.md"
        - .agents/**
        - .claude/**
        - npm/**
        - fuzz/**
        - deploy/**
        - scripts/**
        - action/**
        - tools/corpus/**
        - deny.toml
        - clippy.toml
        - rustfmt.toml
        - hushrun.yaml
        - .github/actionlint.yaml
        - .github/dist-build-setup.yml
        - .github/workflows/ci.yml
        - .github/workflows/nightly.yml
        - .github/workflows/npm.yml
        - .github/workflows/publish.yml
        - .github/workflows/release.yml
        - .github/workflows/skills.yml
