# cargo deny check: advisories, licenses, bans and sources for every target we ship.

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft: unmodified crates (option-ext through dirs, uluru through gix), whose
  # source is published on crates.io. Modifying them would require publishing the changes.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path; they are never published.
allow-wildcard-paths = true
highlight = "all"
# The only C code allowed is the TLS crypto provider (ring), the allocator (mimalloc) and, by
# ADR 0072, SQLite's amalgamation (libsqlite3-sys, bundled) for the local store of what test files
# read, and, by ADR 0078, zstd (zstd-sys) for the pack a build block travels in between machines,
# behind hushrun-core's `pack` feature. Anything else needs an ADR first (plan §0.2).
deny = [
  { crate = "openssl-sys", reason = "C code; use rustls with ring" },
  { crate = "openssl", reason = "C code; use rustls with ring" },
  { crate = "native-tls", reason = "C code on most targets; use rustls with ring" },
  { crate = "aws-lc-sys", reason = "C code that needs CMake; choose the ring provider explicitly" },
  { crate = "aws-lc-rs", reason = "pulls in aws-lc-sys; choose the ring provider explicitly" },
  { crate = "libz-sys", reason = "C code; use a pure-Rust zlib backend" },
  { crate = "libgit2-sys", reason = "C code; use gix and the git CLI" },
  { crate = "git2", reason = "C code; use gix and the git CLI" },
  { crate = "libssh2-sys", reason = "C code" },
  { crate = "curl-sys", reason = "C code" },
  { crate = "bzip2-sys", reason = "C code" },
  { crate = "lzma-sys", reason = "C code" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
