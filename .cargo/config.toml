[alias]
xtask = "run --quiet --package xtask --"

# [ADR 0065] Tests run against fakes and need no network: a coding agent's environment, which a
# test can inherit, would otherwise let the newer-release notice ask GitHub. The notice's own
# tests clear the environment, and set what they need.
[env]
HUSHRUN_NO_UPDATE_CHECK = "1"

# [ADR 0070] mimalloc's C code writes the compiler's __DATE__ and __TIME__ into its library
# (libmimalloc-sys, options.c), so that library differed in every build, and nothing that links
# it could be reused from another build. A compiler takes the date from this variable when it
# is set. The value is 1980-01-01, which every tool accepts; one set in the environment wins.
SOURCE_DATE_EPOCH = "315532800"
