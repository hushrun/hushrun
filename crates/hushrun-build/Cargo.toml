[package]
name = "hushrun-build"
description = "Build blocks: compiled Rust reused between worktrees and runs, as a rustc wrapper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# This crate runs once per compiler call, about a thousand times in a cold build. Nothing here
# may bring in clap, tokio, reqwest, rayon or tracing.
[dependencies]
hushrun-core.workspace = true
hushrun-digest.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Free space on the store's volume (B-22): rustix's safe statvfs(2). The binary builds rustix
# already.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }
