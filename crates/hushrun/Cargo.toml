[package]
name = "hushrun"
description = "Build and validate each piece of content once, then promote it by digest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "hushrun"
path = "src/main.rs"

[package.metadata.dist]
# Released even though the crate is never published to crates.io.
dist = true

[features]
# Integration tests that use real registries, Sigstore and Docker (`cargo test --features it`).
it = ["hushrun-artifact/it", "hushrun-attest/it"]

[dependencies]
base64.workspace = true
jiff.workspace = true
hushrun-artifact.workspace = true
hushrun-attest = { workspace = true, features = ["sigstore"] }
# Build blocks (B-1 … B-22): the wrapper `main` hands over to, and `hushrun build`.
hushrun-build.workspace = true
hushrun-ci.workspace = true
hushrun-ledger = { workspace = true, features = ["cloud"] }
hushrun-tlog.workspace = true
serde.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
mimalloc.workspace = true
hushrun-core.workspace = true
hushrun-reports.workspace = true
hushrun-digest.workspace = true
hushrun-vcs.workspace = true
# The reports the adapters read test by test, already in the build through hushrun-reports:
# \[ADR 0087\] the JUnit file CTest writes, \[ADR 0086\] the xunit file `swift test --parallel`
# writes, \[ADR 0085\] Surefire's and Failsafe's reports.
quick-xml.workspace = true
rayon.workspace = true
# \[ADR 0072\] The local store of what test files read.
rusqlite.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `hushrun update` and the newer-release notice (ADR 0035): the HTTP stack the ledger and the
# registries use, the release's SHA-256, versions, and a working directory beside the binary.
# Each was already part of the binary's build, through other crates: none is new.
hex.workspace = true
reqwest.workspace = true
rustls.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# \[ADR 0072\] Tests read and break the local store as hushrun leaves it.
rusqlite.workspace = true
# Seeding images for the registry integration tests (`--features it`).
oci-client.workspace = true
rustls.workspace = true
tokio.workspace = true
base64.workspace = true
predicates.workspace = true
hushrun-ledger.workspace = true
hushrun-testkit.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# \[ADR 0086\] `pty` and `termios`: the pseudo-terminal hushrun's `swift` copies `swift test`'s
# output through, so that it colors as on the person's terminal.
rustix = { workspace = true, features = ["pty", "termios"] }

[target.'cfg(unix)'.dev-dependencies]
# A terminal for tests of what hushrun says only on one.
rustix = { workspace = true, features = ["pty"] }
