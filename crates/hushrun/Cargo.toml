[package]
name = "hushrun"
description = "Build and validate each piece of content once, then promote it by digest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "hushrun"
path = "src/main.rs"

[package.metadata.dist]
# Released even though the crate is never published to crates.io.
dist = true

[features]
# Integration tests that use real registries, Sigstore and Docker (`cargo test --features it`).
it = ["hushrun-artifact/it", "hushrun-attest/it"]

[dependencies]
base64.workspace = true
jiff.workspace = true
hushrun-artifact.workspace = true
hushrun-attest = { workspace = true, features = ["sigstore"] }
# Build blocks (B-1 … B-22): the wrapper `main` hands over to, and `hushrun build`.
hushrun-build.workspace = true
hushrun-graph.workspace = true
hushrun-ci.workspace = true
hushrun-ledger = { workspace = true, features = ["cloud"] }
hushrun-tlog.workspace = true
serde.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
mimalloc.workspace = true
# \[B-28\] With the pack, which the relay writes and reads.
hushrun-core = { workspace = true, features = ["pack"] }
hushrun-reports.workspace = true
hushrun-digest.workspace = true
hushrun-vcs.workspace = true
# The reports the adapters read test by test, already in the build through hushrun-reports:
# \[ADR 0090\] the JUnit file CTest writes, \[ADR 0089\] the xunit file `swift test --parallel`
# writes, \[ADR 0088\] Surefire's and Failsafe's reports.
quick-xml.workspace = true
rayon.workspace = true
# \[ADR 0072\] The local store of what test files read.
rusqlite.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `hushrun update` and the newer-release notice (ADR 0035): the HTTP stack the ledger and the
# registries use, the release's SHA-256, versions, and a working directory beside the binary.
# Each was already part of the binary's build, through other crates: none is new.
hex.workspace = true
reqwest.workspace = true
rustls.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# \[B-85\] The Xcode compilation-cache service: an HTTP/2 server on a Unix socket, and the
# bytes it sends. All three already part of the binary's build, through reqwest.
h2.workspace = true
http.workspace = true
bytes.workspace = true
# A PUT of a build block's pack streams it from its file (B-29): the stream reqwest's body takes.
# Already part of the binary's build through the ledger's HTTP client.
futures-util.workspace = true
# \[B-31\] The random part of a CI run's store's name. Already part of the binary's build,
# through hushrun-attest.
getrandom.workspace = true
# \[B-49\] A GitLab job's key, derived from its job token by HKDF-SHA256 and wiped from
# memory. Both already part of the binary's build, through hushrun-attest.
ring.workspace = true
# \[B-71\] A baked store's archive compressed with zstd when its name ends in `.zst`. Already part
# of the binary's build, through hushrun-core's packs.
zstd.workspace = true
zeroize.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# \[ADR 0072\] Tests read and break the local store as hushrun leaves it.
rusqlite.workspace = true
# Seeding images for the registry integration tests (`--features it`).
oci-client.workspace = true
rustls.workspace = true
tokio.workspace = true
base64.workspace = true
predicates.workspace = true
hushrun-ledger.workspace = true
hushrun-testkit.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
# \[ADR 0089\] `pty` and `termios`: the pseudo-terminal hushrun's `swift` copies `swift test`'s
# output through, so that it colors as on the person's terminal.
rustix = { workspace = true, features = ["pty", "termios", "process"] }

[target.'cfg(unix)'.dev-dependencies]
# A terminal for tests of what hushrun says only on one.
rustix = { workspace = true, features = ["pty"] }
