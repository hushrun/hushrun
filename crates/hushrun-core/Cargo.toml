[package]
name = "hushrun-core"
description = "hushrun's types, configuration parsing and validation, and the planner (pure: no IO)."
# Fixed: the hosted service builds with this crate, and a CLI release must not change its lockfile.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
jiff.workspace = true
regex-automata.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zlib-rs.workspace = true
# \[B-27, B-28\] Sealing and packing a build block (`blocks::pack`): ring's HKDF, HMAC and
# ChaCha20-Poly1305, and zstd. Off by default: the backend uses this crate's wire types and never
# opens a pack.
ring = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[features]
pack = ["dep:ring", "dep:zstd"]

[dev-dependencies]
proptest.workspace = true
