[package]
name = "hushrun-attest"
description = "in-toto statements, DSSE envelopes and Sigstore bundles, keys, certificates, timestamps and event verification."
# Fixed: the hosted service builds with this crate, and a CLI release must not change its lockfile.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Keyless signing and timestamps (M10): the CI's ID token, Fulcio, RFC 3161 timestamp
# authorities, and the TUF client that refreshes the Sigstore trust root. Network code: verifying
# never needs it, so the control plane's server builds without it.
sigstore = ["dep:reqwest", "dep:rustls", "dep:tokio"]
# Certificates, timestamps and trust roots made with test keys (dev only).
testing = []
# Integration tests against the public-good Sigstore instance; they use the network.
it = ["sigstore"]

[dependencies]
base64.workspace = true
cms.workspace = true
der.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
jiff.workspace = true
hushrun-core.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
x509-cert.workspace = true
zeroize.workspace = true

reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The loopback HTTP server for the fake Fulcio and timestamp authorities. The testkit
# depends on this crate too; the two builds share no types, only bytes.
hushrun-testkit.workspace = true
tempfile.workspace = true
