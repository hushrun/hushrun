name: "forcing -> full, every required check, though all passed and the image is reusable"
covers: [P-9, I-6]
description: "A forced run ignores the evidence: it builds and runs every check `Policy::required()` names, in its order"
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: manual, force: true}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: passed, run: p1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
deployed:
  - {digest: this, at: "15:04", by: ci, run: p1}
expect:
  mode: full
  reason: "forced: building and running every required check"
  build: true
  checks: [toolchain, unit]
  artifacts: {}
  requirements: {toolchain: satisfied, unit: satisfied}
