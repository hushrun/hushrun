name: a newer deployment of other content turns current into a deploy
covers: [P-10, I-4, L-8]
description: The newest deployed event decides
policy: deploy.yaml
scope: api
now: "12:00"
context: {branch: main, trigger: push}
events:
  - {kind: check, run: sec1, at: "09:30", by: ci, check: sast}
  - {kind: started, run: c1, at: "10:00", by: ci}
  - {kind: check, run: c1, at: "10:01", by: ci, check: unit}
  - {kind: check, run: c1, at: "10:01", by: ci, check: lint, image: "golangci/golangci-lint@1", platform: linux/amd64}
  - {kind: check, run: c1, at: "10:02", by: ci, check: e2e}
  - {kind: artifact, run: c1, at: "10:03", by: ci, artifact: api-image, ref: "ghcr.io/acme/api@a"}
  - {kind: passed, run: c1, at: "10:05", by: ci, artifacts: {api-image: "ghcr.io/acme/api@a"}}
deployed:
  - {digest: this, at: "11:00", by: ci}
  - {digest: other, at: "11:45", by: ci}
expect:
  mode: promote
