name: a passed exactly 60 s after a failed wins
covers: [P-6, P-13]
description: >-
  P-6 lets a failure win over a passed less than 60 s after it (clock skew). At exactly 60 s,
  the passed is later: a retried job succeeded, and the attempt's image is reused.
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: failed, run: p1, at: "15:03:00", by: ci, reason: smoke test flaked}
  - {kind: passed, run: p1, at: "15:04:00", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
expect:
  mode: promote
  artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
