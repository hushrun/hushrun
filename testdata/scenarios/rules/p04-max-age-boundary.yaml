name: evidence exactly max_age old is still satisfied
covers: [P-4]
description: "expired means older than max_age: at exactly 1h, unit's evidence still counts."
policy_yaml: |
  version: 1
  repository: github.com/Acme/api
  artifacts:
    image:
      type: oci
      location: us-central1-docker.pkg.dev/acme-prod/api/go
  checks:
    toolchain: {run: ./toolchain.sh}
    unit: {run: go test ./..., max_age: 1h}
  deploy:
    branch: main
now: "16:01"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: passed, run: p1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
expect:
  mode: promote
  requirements: {unit: satisfied}
