name: a check that pins only an image counts only evidence from that image
covers: [P-1, E-7]
description: >-
  toolchain pins an image and no platform. Evidence from another image doesn't count, whatever
  the platform.
policy_yaml: |
  version: 1
  repository: github.com/Acme/api
  artifacts:
    image:
      type: oci
      location: us-central1-docker.pkg.dev/acme-prod/api/go
  checks:
    toolchain:
      run: ./toolchain.sh
      image: golang@sha256:1111111111111111111111111111111111111111111111111111111111111111
    unit: {run: go test ./...}
  deploy:
    branch: main
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain, image: "golang@2", platform: linux/amd64}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: passed, run: p1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
expect:
  mode: refresh
  checks: [toolchain]
  requirements: {toolchain: missing, unit: satisfied}
