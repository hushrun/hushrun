name: "the newest evidence decides: a later pass"
covers: [P-4]
description: "unit failed, then passed on a re-run"
policy: deploy.yaml
scope: api
now: "12:00"
context: {branch: main, trigger: push}
events:
  - {kind: check, run: sec1, at: "09:30", by: ci, check: sast}
  - {kind: started, run: c1, at: "10:00", by: ci}
  - {kind: check, run: c1, at: "10:00", by: ci, check: unit, result: fail}
  - {kind: check, run: c1, at: "10:01", by: ci, check: lint, image: "golangci/golangci-lint@1", platform: linux/amd64}
  - {kind: check, run: c1, at: "10:02", by: ci, check: e2e}
  - {kind: check, run: c1, at: "10:20", by: ci, check: unit, attempts: 2}
  - {kind: artifact, run: c1, at: "10:21", by: ci, artifact: api-image, ref: "ghcr.io/acme/api@a"}
  - {kind: passed, run: c1, at: "10:25", by: ci, artifacts: {api-image: "ghcr.io/acme/api@a"}}
expect:
  mode: promote
  requirements: {unit: satisfied}
