name: an artifact a signer that doesn't count recorded is ignored while the repository is CI-only
covers: [P-13, T-16]
description: "The repository takes artifacts from its CI only (T-16): an agent's newer image in the same run isn't a candidate"
policy: deploy.yaml
ci_only: true
scope: api
now: "12:00"
context: {branch: main, trigger: push}
events:
  - {kind: check, run: sec1, at: "09:30", by: ci, check: sast}
  - {kind: started, run: c1, at: "10:00", by: ci}
  - {kind: check, run: c1, at: "10:01", by: ci, check: unit}
  - {kind: check, run: c1, at: "10:01", by: ci, check: lint, image: "golangci/golangci-lint@1", platform: linux/amd64}
  - {kind: check, run: c1, at: "10:02", by: ci, check: e2e}
  - {kind: artifact, run: c1, at: "10:03", by: ci, artifact: api-image, ref: "ghcr.io/acme/api@a"}
  - {kind: artifact, run: c1, at: "10:04", by: agent-fleet, artifact: api-image, ref: "ghcr.io/acme/api@d", custody: isolated}
  - {kind: passed, run: c1, at: "10:05", by: ci, artifacts: {api-image: "ghcr.io/acme/api@a"}}
expect:
  mode: promote
  artifacts: {api-image: "ghcr.io/acme/api@a"}
