name: an attempt that passed in CI but recorded no outcome doesn't give its image -> promote the older one's
covers: [P-6, P-13]
description: "Liveness says p2 succeeded, but there is no verdict: only passed and stale-superseded attempts give reusable images"
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: passed, run: p1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
  - {kind: started, run: p2, at: "15:30", by: ci}
  - {kind: artifact, run: p2, at: "15:31", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@b"}
liveness:
  - {run: p2, state: no-verdict}
expect:
  mode: promote
  artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
