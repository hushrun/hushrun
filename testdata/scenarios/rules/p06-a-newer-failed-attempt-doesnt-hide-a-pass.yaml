name: a newer attempt of this digest failed, an older one passed -> promote the older one's image
covers: [P-6, P-13]
description: >-
  A re-run of the digest failed in its deploy step; the image an earlier attempt passed with is
  still reusable, and its checks still count. hushrun 0.8 blocked the next stage on the
  upstream's newest verdict (P-7, removed in ADR 0062): with one pipeline, the deploy step runs
  again with that image.
policy: acme-api.yaml
now: "13:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "10:00", by: ci}
  - {kind: check, run: p1, at: "10:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "10:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "10:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: passed, run: p1, at: "10:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
  - {kind: started, run: p2, at: "12:00", by: ci}
  - {kind: artifact, run: p2, at: "12:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@c"}
  - {kind: failed, run: p2, at: "12:05", by: ci, reason: smoke test failed}
expect:
  mode: promote
  artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
