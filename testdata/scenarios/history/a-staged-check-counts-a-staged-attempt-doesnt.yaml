name: "hushrun 0.8 history: staging's checks count, its attempt doesn't -> full, no checks"
covers: [P-1, P-5, P-13, P-15]
description: >-
  hushrun 0.8 recorded a staging attempt that passed this digest and built the image. Its check
  events count: evidence is about the files, whatever stage recorded it. Its lifecycle events
  form no attempt of the one pipeline (ADR 0062), so its image isn't reused, even pinned at the
  artifact's location: the first 0.9 run builds once.
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, stage: staging, run: s1, at: "15:00", by: ci}
  - {kind: check, stage: staging, run: s1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, stage: staging, run: s1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, stage: staging, run: s1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: deployed, stage: staging, run: s1, at: "15:03", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
  - {kind: passed, stage: staging, run: s1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
expect:
  mode: full
  reason: "no reusable `image` (recorded ones aren't reusable: none is pinned at its location by a signer that counts, from an attempt that passed): building"
  build: true
  checks: []
  requirements: {toolchain: satisfied, unit: satisfied}
