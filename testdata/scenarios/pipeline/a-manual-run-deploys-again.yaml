name: "a manual run deploys a digest the repository already runs -> promote"
covers: [P-10, I-5]
description: "A run started by hand, without --force-full, ignores the deployed mark (was ci-promote case 29)"
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: manual}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: deployed, run: p1, at: "15:10", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
  - {kind: passed, run: p1, at: "15:11", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
deployed:
  - {digest: this, at: "15:10", by: ci, run: p1}
expect:
  mode: promote
  build: false
  artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
