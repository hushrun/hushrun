name: "a revert to content an earlier attempt passed and deployed -> promote"
covers: [P-1, P-5, P-10, P-13, P-14]
description: >-
  An earlier attempt of the pipeline passed this digest and deployed its image; other content was
  deployed since. Pushing a revert of these files reuses the checks and the image by digest (was
  ci-promote case 01).
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: deployed, run: p1, at: "15:03", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
  - {kind: passed, run: p1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
deployed:
  - {digest: this, at: "15:03", by: ci, run: p1}
  - {digest: other, at: "15:30", by: ci}
expect:
  mode: promote
  reason: "every required check is met: deploying image us-central1-docker.pkg.dev/acme-prod/api/go@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa by digest"
  build: false
  artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  checks: []
  requirements: {toolchain: satisfied, unit: satisfied}
