name: "the artifact is pinned at the location a stage used to have -> full"
covers: [P-13]
description: >-
  hushrun 0.8 promoted the image from staging's registry to production's. With one `location`,
  an image pinned in the old staging registry is somewhere else, and isn't reused (ADR 0062).
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-test/api/go@a"}
  - {kind: passed, run: p1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-test/api/go@a"}}
expect:
  mode: full
  reason: "(recorded ones aren't reusable"
  build: true
  checks: []
