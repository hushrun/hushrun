name: "the stale guard stopped an attempt before its build -> full, no checks"
covers: [P-6, P-15]
description: >-
  The checks passed, then a newer revision superseded the attempt (reason stale) before it
  built: only the build remains (was ci-promote case 05)
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: superseded, run: p1, at: "15:02", by: ci, reason: stale}
expect:
  mode: full
  reason: "no reusable `image` (none was recorded): building"
  build: true
  checks: []
