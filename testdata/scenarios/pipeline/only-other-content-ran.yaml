name: "only other content passed and failed -> full"
covers: [P-15, I-4]
description: >-
  Attempts, checks and artifacts of another digest never count for this one (was ci-promote
  cases 10 and 19)
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: o1, at: "15:00", by: ci, digest: other}
  - {kind: check, run: o1, at: "15:01", by: ci, check: toolchain, digest: other}
  - {kind: check, run: o1, at: "15:01", by: ci, check: unit, digest: other}
  - {kind: artifact, run: o1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a", digest: other}
  - {kind: passed, run: o1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}, digest: other}
  - {kind: started, run: o2, at: "15:10", by: ci, digest: other}
  - {kind: check, run: o2, at: "15:11", by: ci, digest: other, check: unit, result: fail}
  - {kind: failed, run: o2, at: "15:12", by: ci, digest: other, reason: unit failed}
expect:
  mode: full
  reason: "no reusable `image` (none was recorded): building and running toolchain (missing), unit (missing)"
  build: true
  checks: [toolchain, unit]
