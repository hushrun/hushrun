name: "an earlier attempt's tests failed this digest -> full, running them again"
covers: [P-4, P-6, P-15]
description: >-
  A failure doesn't block the pipeline: the failed check runs again, with the build, as a
  re-run or a push of the same files would want (was ci-promote case 04, which blocked on
  staging's failure)
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci, url: "https://ci.example.com/p1"}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit, result: fail}
  - {kind: failed, run: p1, at: "15:02", by: ci, reason: unit failed}
expect:
  mode: full
  reason: "no reusable `image` (none was recorded): building and running toolchain (missing), unit (failed)"
  build: true
  checks: [toolchain, unit]
  requirements: {toolchain: missing, unit: failed}
