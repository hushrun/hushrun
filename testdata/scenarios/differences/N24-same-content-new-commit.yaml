name: "N24: a new commit with the deployed content -> current"
covers: [P-10]
description: "§8.7 N24: ci-promote deploys again; hushrun matches by digest"
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push, run: new-commit}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: deployed, run: p1, at: "15:30", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
  - {kind: passed, run: p1, at: "15:31", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}}
deployed:
  - {digest: this, at: "15:30", by: ci, run: p1}
expect:
  mode: current
