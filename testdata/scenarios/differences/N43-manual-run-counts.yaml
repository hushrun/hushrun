name: "N43: an attempt a manual run made counts"
covers: [P-5, P-13]
description: "§8.7 N43: ci-promote only looks at push runs; hushrun counts every attempt of the pipeline, whatever started it"
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: m1, at: "15:00", by: ci, trigger: manual}
  - {kind: check, run: m1, at: "15:01", by: ci, check: toolchain, trigger: manual}
  - {kind: check, run: m1, at: "15:01", by: ci, check: unit, trigger: manual}
  - {kind: artifact, run: m1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a", trigger: manual}
  - {kind: passed, run: m1, at: "15:04", by: ci, artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}, trigger: manual}
expect:
  mode: promote
  artifacts: {image: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
