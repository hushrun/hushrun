name: "a cancelled attempt's image is never reused -> full"
covers: [P-6, P-13]
description: Only stale-superseded attempts keep their artifacts reusable; a cancellation may have interrupted anything
policy: acme-api.yaml
now: "16:00"
context: {branch: main, trigger: push}
events:
  - {kind: started, run: p1, at: "15:00", by: ci}
  - {kind: check, run: p1, at: "15:01", by: ci, check: toolchain}
  - {kind: check, run: p1, at: "15:01", by: ci, check: unit}
  - {kind: artifact, run: p1, at: "15:02", by: ci, artifact: image, ref: "us-central1-docker.pkg.dev/acme-prod/api/go@a"}
  - {kind: superseded, run: p1, at: "15:03", by: ci, reason: cancelled}
expect:
  mode: full
  build: true
  checks: []
