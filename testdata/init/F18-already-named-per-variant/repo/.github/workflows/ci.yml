on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go: ["1.22", "1.23"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hushrun/hushrun/action/setup@v0
      - run: hushrun run test-${{ strategy.job-index }} -- go test ./...
