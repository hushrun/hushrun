name: CI
on: [push, pull_request]

jobs:
  back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked
        working-directory: back
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --workspace --locked
