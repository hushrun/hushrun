name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regrtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./python -m test --multiprocess 0 --timeout 4500
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -Wall tests/runtests.py -v2
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m unittest discover -s scripts
  spring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./gradlew build
  rails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bundle exec rake
