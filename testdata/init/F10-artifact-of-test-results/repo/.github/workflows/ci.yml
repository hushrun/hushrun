on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pytest --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
