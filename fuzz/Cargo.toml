# Fuzz targets (cargo-fuzz; nightly only). Kept out of the main workspace so the release
# build never depends on libFuzzer. Run: cargo +nightly fuzz run <target> -- -max_total_time=60
[package]
name = "hushrun-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hushrun-attest = { path = "../crates/hushrun-attest" }
hushrun-core = { path = "../crates/hushrun-core" }
hushrun-reports = { path = "../crates/hushrun-reports" }
serde_json = "1"

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sigstore"
path = "fuzz_targets/sigstore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "statement"
path = "fuzz_targets/statement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy"
path = "fuzz_targets/policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reports"
path = "fuzz_targets/reports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hints"
path = "fuzz_targets/hints.rs"
test = false
doc = false
bench = false

[workspace]
